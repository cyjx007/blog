<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>找不到这一页 — 纸短情长</title>
  <meta name="robots" content="noindex, nofollow">
  <script>
    // GitHub Pages 不支持 _redirects，旧 Hexo 的 /archives/... 在这里兜一下
    (function () {
      var p = location.pathname;
      if (p === '/archives' || p === '/archives/' || p.indexOf('/archives/') === 0) {
        location.replace('/posts/' + (location.hash || ''));
      }
    })();
  </script>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font: 16px/1.8 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif;
      background: #fbf8f1; color: #3a342b; padding: 2rem;
    }
    main { max-width: 30rem; }
    h1 { font-size: 3rem; margin: 0 0 .5rem; letter-spacing: .05em; }
    p { margin: .5rem 0; color: #6b6255; }
    a { color: #8a5a2b; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>这封信没有寄到，或者地址写错了。</p>
    <p><a href="/posts/">去信匣翻一翻</a> · <a href="/">回首页</a></p>
  </main>
</body>
</html>
